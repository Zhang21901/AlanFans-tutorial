name: Monitor X posts

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run the monitor or send a Feishu test card"
        required: true
        default: monitor
        type: choice
        options:
          - monitor
          - test-message
          - check-rss

permissions:
  contents: write

concurrency:
  group: x-post-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
      FEISHU_SIGNING_SECRET: ${{ secrets.FEISHU_SIGNING_SECRET }}
      TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
      X_ACCOUNT: YOUR_X_USERNAME
      RSS_URL: http://127.0.0.1:1200/twitter/user/YOUR_X_USERNAME
      FILTER_RETWEETS: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start authenticated RSSHub
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'test-message'
        run: |
          if [ -z "$TWITTER_AUTH_TOKEN" ]; then
            echo "TWITTER_AUTH_TOKEN is not configured. Add it as a GitHub Actions repository secret."
            exit 1
          fi

          docker run --detach --rm \
            --name rsshub \
            --publish 127.0.0.1:1200:1200 \
            --env NODE_ENV=production \
            --env TWITTER_AUTH_TOKEN \
            diygod/rsshub:2026-10-23

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:1200/healthz > /dev/null; then
              echo "RSSHub is ready."
              exit 0
            fi
            sleep 2
          done

          echo "RSSHub did not become ready within 60 seconds."
          docker logs rsshub
          exit 1

      - name: Send Feishu test card
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test-message'
        run: python monitor.py --send-test

      - name: Check RSSHub feed
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'check-rss'
        run: python monitor.py --check-rss

      - name: Check for new X posts
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'monitor'
        run: python monitor.py

      - name: Persist deduplication state
        if: always()
        run: |
          if git diff --quiet -- state.json; then
            echo "No state changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update X monitor state"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Stop RSSHub
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.mode != 'test-message')
        run: docker rm --force rsshub || true
